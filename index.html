<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CGPA Calculator Pro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      min-height:100vh;
      background:
      linear-gradient(135deg,#0f172a,#111827,#1e293b);
      color:white;
      overflow-x:hidden;
    }

    .bg-glow{
      position:fixed;
      width:400px;
      height:400px;
      border-radius:50%;
      filter:blur(100px);
      z-index:-1;
      opacity:0.35;
    }

    .glow1{
      background:#3b82f6;
      top:-120px;
      left:-120px;
    }

    .glow2{
      background:#8b5cf6;
      bottom:-120px;
      right:-120px;
    }

    .container{
      width:95%;
      max-width:1300px;
      margin:auto;
      padding:40px 20px;
    }

    .hero{
      text-align:center;
      margin-bottom:40px;
    }

    .hero h1{
      font-size:3rem;
      font-weight:700;
      background:linear-gradient(to right,#60a5fa,#c084fc);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .hero p{
      color:#cbd5e1;
      margin-top:12px;
      font-size:1rem;
    }

    .top-stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      margin-bottom:35px;
    }

    .stat-card{
      background:rgba(255,255,255,0.06);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:22px;
      padding:25px;
      transition:0.3s;
      box-shadow:0 10px 25px rgba(0,0,0,0.25);
    }

    .stat-card:hover{
      transform:translateY(-4px);
    }

    .stat-title{
      color:#cbd5e1;
      font-size:0.9rem;
      margin-bottom:10px;
    }

    .stat-value{
      font-size:2rem;
      font-weight:700;
    }

    .cgpa-value{
      color:#60a5fa;
    }

    .credit-value{
      color:#4ade80;
    }

    .semester-container{
      display:flex;
      flex-direction:column;
      gap:25px;
    }

    .semester-card{
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(12px);
      border-radius:25px;
      padding:25px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
      animation:fadeIn 0.4s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .semester-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
      flex-wrap:wrap;
      gap:15px;
    }

    .semester-header h2{
      font-size:1.4rem;
    }

    .semester-actions{
      display:flex;
      gap:12px;
    }

    button{
      border:none;
      outline:none;
      cursor:pointer;
      font-family:'Poppins',sans-serif;
      transition:0.3s;
    }

    .btn{
      padding:11px 18px;
      border-radius:14px;
      font-weight:600;
      font-size:0.9rem;
    }

    .btn-primary{
      background:linear-gradient(to right,#3b82f6,#8b5cf6);
      color:white;
    }

    .btn-primary:hover{
      transform:scale(1.03);
    }

    .btn-danger{
      background:#ef4444;
      color:white;
    }

    .btn-danger:hover{
      background:#dc2626;
    }

    .btn-add-course{
      background:#0ea5e9;
      color:white;
    }

    .btn-add-course:hover{
      background:#0284c7;
    }

    .table-wrapper{
      overflow-x:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:700px;
    }

    th{
      text-align:left;
      padding:14px;
      background:rgba(255,255,255,0.08);
      color:#e2e8f0;
      font-weight:600;
    }

    td{
      padding:12px 14px;
      border-bottom:1px solid rgba(255,255,255,0.07);
    }

    input, select{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:none;
      background:rgba(255,255,255,0.08);
      color:white;
      font-family:'Poppins',sans-serif;
      font-size:0.95rem;
    }

    input:focus,
    select:focus{
      outline:2px solid #60a5fa;
    }

    select option{
      background:#1e293b;
      color:white;
    }

    .semester-summary{
      display:flex;
      justify-content:space-between;
      margin-top:18px;
      gap:15px;
      flex-wrap:wrap;
    }

    .summary-box{
      flex:1;
      min-width:220px;
      background:rgba(255,255,255,0.05);
      border-radius:18px;
      padding:18px;
    }

    .summary-box h4{
      color:#cbd5e1;
      margin-bottom:8px;
      font-size:0.9rem;
    }

    .summary-box p{
      font-size:1.5rem;
      font-weight:700;
    }

    .footer-buttons{
      display:flex;
      justify-content:center;
      gap:20px;
      margin-top:40px;
      flex-wrap:wrap;
    }

    .big-btn{
      padding:16px 30px;
      font-size:1rem;
      border-radius:18px;
      font-weight:700;
    }

    .reset-btn{
      background:#ef4444;
      color:white;
    }

    .reset-btn:hover{
      background:#dc2626;
    }

    .add-semester-btn{
      background:linear-gradient(to right,#06b6d4,#3b82f6);
      color:white;
    }

    .add-semester-btn:hover{
      transform:translateY(-3px);
    }

    .credit-good{
      color:#4ade80;
    }

    .credit-mid{
      color:#facc15;
    }

    .credit-low{
      color:#f87171;
    }

    @media(max-width:768px){

      .hero h1{
        font-size:2.2rem;
      }

      .semester-header{
        flex-direction:column;
        align-items:flex-start;
      }

      .semester-actions{
        width:100%;
      }

      .semester-actions button{
        flex:1;
      }

      .footer-buttons{
        flex-direction:column;
      }

      .footer-buttons button{
        width:100%;
      }
    }
  </style>
</head>

<body>

  <div class="bg-glow glow1"></div>
  <div class="bg-glow glow2"></div>

  <div class="container">

    <div class="hero">
      <h1>CGPA Calculator Pro</h1>
      <p>Modern Semester Wise Credit-Based GPA & CGPA Calculator</p>
    </div>

    <div class="top-stats">

      <div class="stat-card">
        <div class="stat-title">Overall CGPA</div>
        <div class="stat-value cgpa-value" id="overallCGPA">0.00</div>
      </div>

      <div class="stat-card">
        <div class="stat-title">Total Credits</div>
        <div class="stat-value credit-value" id="overallCredits">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-title">Completed Semesters</div>
        <div class="stat-value" id="semesterCount">0</div>
      </div>

    </div>

    <div class="semester-container" id="semesterContainer"></div>

    <div class="footer-buttons">
      <button class="big-btn add-semester-btn" onclick="addSemester()">
        + Add Semester
      </button>

      <button class="big-btn reset-btn" onclick="resetAll()">
        Reset All
      </button>
    </div>

  </div>

  <script>

    let semesterIndex = 0;

    const gradePoints = {
      "A+":4.00,
      "A":3.75,
      "A-":3.50,
      "B+":3.25,
      "B":3.00,
      "B-":2.75,
      "C+":2.50,
      "C":2.25,
      "D":2.00,
      "F":0.00
    };

    function addSemester(){

      semesterIndex++;

      const semesterCard = document.createElement("div");
      semesterCard.className = "semester-card";
      semesterCard.id = `semester-${semesterIndex}`;

      semesterCard.innerHTML = `
      
      <div class="semester-header">

        <h2>Semester ${semesterIndex}</h2>

        <div class="semester-actions">

          <button class="btn btn-add-course"
          onclick="addCourse(${semesterIndex})">
          + Add Course
          </button>

          <button class="btn btn-danger"
          onclick="removeSemester(${semesterIndex})">
          Delete
          </button>

        </div>

      </div>

      <div class="table-wrapper">

      <table>
        <thead>
          <tr>
            <th>Course Name</th>
            <th>Credit</th>
            <th>Grade</th>
            <th>Grade Point</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="course-body-${semesterIndex}"></tbody>

      </table>

      </div>

      <div class="semester-summary">

        <div class="summary-box">
          <h4>Semester GPA</h4>
          <p id="gpa-${semesterIndex}">0.00</p>
        </div>

        <div class="summary-box">
          <h4>Total Credits</h4>
          <p id="credits-${semesterIndex}">0</p>
        </div>

      </div>
      `;

      document.getElementById("semesterContainer")
      .appendChild(semesterCard);

      addCourse(semesterIndex);

      updateOverall();
    }

    function addCourse(semesterId){

      const tbody =
      document.getElementById(`course-body-${semesterId}`);

      const row = document.createElement("tr");

      row.innerHTML = `
      
      <td>
        <input type="text"
        placeholder="Course Name">
      </td>

      <td>
        <input type="number"
        min="0"
        step="0.5"
        value="3"
        class="credit-input"
        onchange="updateSemester(${semesterId})">
      </td>

      <td>
        <select class="grade-select"
        onchange="updateSemester(${semesterId})">

          <option>A+</option>
          <option>A</option>
          <option>A-</option>
          <option>B+</option>
          <option>B</option>
          <option>B-</option>
          <option>C+</option>
          <option>C</option>
          <option>D</option>
          <option>F</option>

        </select>
      </td>

      <td class="grade-point">4.00</td>

      <td>
        <button class="btn btn-danger"
        onclick="removeCourse(this, ${semesterId})">
        Remove
        </button>
      </td>
      `;

      tbody.appendChild(row);

      updateSemester(semesterId);
    }

    function removeCourse(button, semesterId){
      button.closest("tr").remove();
      updateSemester(semesterId);
    }

    function removeSemester(id){
      document.getElementById(`semester-${id}`).remove();
      updateOverall();
    }

    function updateSemester(semesterId){

      const tbody =
      document.getElementById(`course-body-${semesterId}`);

      const rows = tbody.querySelectorAll("tr");

      let totalCredits = 0;
      let totalPoints = 0;

      rows.forEach(row=>{

        const credit =
        parseFloat(
          row.querySelector(".credit-input").value
        ) || 0;

        const grade =
        row.querySelector(".grade-select").value;

        const point = gradePoints[grade];

        row.querySelector(".grade-point")
        .textContent = point.toFixed(2);

        totalCredits += credit;
        totalPoints += credit * point;
      });

      const gpa =
      totalCredits > 0
      ? (totalPoints / totalCredits).toFixed(2)
      : "0.00";

      document.getElementById(`gpa-${semesterId}`)
      .textContent = gpa;

      document.getElementById(`credits-${semesterId}`)
      .textContent = totalCredits;

      updateOverall();
    }

    function updateOverall(){

      const semesterCards =
      document.querySelectorAll(".semester-card");

      let overallCredits = 0;
      let overallPoints = 0;

      semesterCards.forEach(card=>{

        const tbody =
        card.querySelector("tbody");

        const rows =
        tbody.querySelectorAll("tr");

        rows.forEach(row=>{

          const credit =
          parseFloat(
            row.querySelector(".credit-input").value
          ) || 0;

          const grade =
          row.querySelector(".grade-select").value;

          const point =
          gradePoints[grade];

          overallCredits += credit;
          overallPoints += credit * point;
        });
      });

      const cgpa =
      overallCredits > 0
      ? (overallPoints / overallCredits).toFixed(2)
      : "0.00";

      document.getElementById("overallCGPA")
      .textContent = cgpa;

      document.getElementById("overallCredits")
      .textContent = overallCredits;

      document.getElementById("semesterCount")
      .textContent = semesterCards.length;
    }

    function resetAll(){

      if(confirm("Are you sure you want to reset everything?")){

        document.getElementById("semesterContainer")
        .innerHTML = "";

        semesterIndex = 0;

        updateOverall();
      }
    }

    addSemester();

  </script>

</body>
</html>
